  text_serverless_costexplorer_unreachable: Cost Explorer(ce.us-east-1.amazonaws.com)につながりませんでした。インターネットにつながらないネットワークでは、NAT などの経路が必要です。
  text_serverless_costexplorer_refresh: "定期の取得は毎日動きます。データが 1 時間より古いときは、このページを開くか、このボタンで、費用を取得し直します。取得は 1 時間に 1 回までです。1 回の取得で Cost Explorer に %{count} 件の要求を送り、AWS は要求ごとに課金します。"
  text_serverless_costexplorer_refresh_after: "%{time} から使えます。"
